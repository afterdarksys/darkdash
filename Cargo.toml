[package]
name = "darkdash"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97.1"
license = "UNLICENSED"
description = "Loopback operator console for the local darksignal queue"

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
getrandom = { version = "0.3.4", features = ["std"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
